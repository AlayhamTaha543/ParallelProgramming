services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    container_name: ecommerce_web
    command: bash /app/scripts/gunicorn_start.sh
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      DJANGO_SECRET_KEY: change-me-for-production
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ecommerce
      DJANGO_DB_USER: ecommerce
      DJANGO_DB_PASSWORD: ecommerce
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 2
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  celery:
    build: .
    command: celery -A ecommerce worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
